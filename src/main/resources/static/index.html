<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер валют (Без JS)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Курс валют (только Java + HTML)</h1>
<p>Нажмите кнопку, чтобы отправить запрос на сервер:</p>

<!-- ФОРМА 1: Рубль -->
<form action="/api/currency/rate" method="GET">
    <input type="hidden" name="currency" value="RUB">
    <button type="submit">Рубль (RUB)</button>
</form>

<!-- ФОРМА 2: Евро -->
<form action="/api/currency/rate" method="GET">
    <input type="hidden" name="currency" value="EUR">
    <button type="submit">Евро (EUR)</button>
</form>

<!-- ФОРМА 3: Фунт -->
<form action="/api/currency/rate" method="GET">
    <input type="hidden" name="currency" value="GBP">
    <button type="submit">Фунт (GBP)</button>
</form>

</body>
</html>
