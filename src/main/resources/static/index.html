<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер валют</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>Курс валют (от внешнего API)</h1>

<p>Нажмите кнопку, чтобы узнать курс валюты к USD:</p>

<button onclick="getRate('RUB')">Рубль (RUB)</button>
<button onclick="getRate('EUR')">Евро (EUR)</button>
<button onclick="getRate('GBP')">Фунт (GBP)</button>
<button onclick="getRate('JPY')">Йена (JPY)</button>

<div id="result">Нажмите кнопку...</div>

<script>
    async function getRate(currency) {
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = 'Загрузка...';

        try {
            console.log('=== ОТПРАВКА ЗАПРОСА ===');
            console.log('Запрашиваем валюту:', currency);

            // Делаем запрос на наш БЭКЕНД
            const response = await fetch(`/api/currency/rate?currency=${currency}`);

            // Получаем СЫРОЙ ТЕКСТ ответа
            const responseText = await response.text();
            console.log('Сырой ответ от сервера (текст):', responseText);
            console.log('Тип данных responseText:', typeof responseText);

            // Пытаемся распарсить как JSON
            let rate;
            try {
                rate = JSON.parse(responseText);
                console.log('Распарсенный JSON:', rate);
                console.log('Тип данных rate:', typeof rate);
            } catch (e) {
                console.error('Не удалось распарсить JSON:', e);
                resultDiv.textContent = 'Ошибка парсинга ответа от сервера';
                return;
            }

            // Проверяем тип данных
            if (typeof rate === 'number') {
                console.log('✅ Это число! Показываем результат.');
                resultDiv.textContent = `1 USD = ${rate} ${currency}`;
            } else if (typeof rate === 'object' && rate !== null) {
                console.error('❌ Это объект, а не число!');
                console.error('Содержимое объекта:', JSON.stringify(rate, null, 2));
                resultDiv.textContent = `Ошибка: сервер вернул объект вместо числа. Проверьте консоль.`;
            } else {
                console.error('❌ Неизвестный тип данных:', typeof rate);
                resultDiv.textContent = `Ошибка: неожиданный тип данных (${typeof rate})`;
            }

        } catch (error) {
            console.error('Общая ошибка:', error);
            resultDiv.textContent = 'Ошибка: ' + error.message;
        }
    }
</script>
</body>
</html>
